<svg xmlns="http://www.w3.org/2000/svg" width="192" height="96" viewBox="0 0 192 96">
  <defs>
    <filter id="stone">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="192" height="96" fill="#0D0B0A"/>
  <!-- Row 1: block A (0-94), block B (96-190) -->
  <rect x="0" y="0" width="94" height="46" rx="1" fill="#141210" filter="url(#stone)"/>
  <rect x="96" y="0" width="96" height="46" rx="1" fill="#100E0C" filter="url(#stone)"/>
  <!-- Row 2: block C (48-190), half at edge (0-46) -->
  <rect x="0" y="50" width="46" height="46" rx="1" fill="#100E0C" filter="url(#stone)"/>
  <rect x="48" y="50" width="144" height="46" rx="1" fill="#161412" filter="url(#stone)"/>
  <!-- Subtle block edge highlights -->
  <line x1="0" y1="46" x2="94" y2="46" stroke="#000" stroke-width="2" opacity="0.6"/>
  <line x1="96" y1="46" x2="192" y2="46" stroke="#000" stroke-width="2" opacity="0.6"/>
  <line x1="94" y1="0" x2="94" y2="46" stroke="#000" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="96" x2="46" y2="96" stroke="#000" stroke-width="2" opacity="0.6"/>
  <line x1="48" y1="96" x2="192" y2="96" stroke="#000" stroke-width="2" opacity="0.6"/>
  <line x1="46" y1="50" x2="46" y2="96" stroke="#000" stroke-width="2" opacity="0.5"/>
</svg>
